<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      lang="es">
<h:head>
    <meta charset="UTF-8" />
    <title>Materiales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"></link>

    <h:outputStylesheet library="assets" name="css/StylesLoan.css" />
</h:head>
<h:body>
    <!-- Header -->
    <ui:include src="/assets/components/header/header.xhtml" />



    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="m-0">Subir Notas</h2>

        </div>
        <!-- Contenedor de tarjetas -->
        <h:form id="groupTable">
            <table class="table table-bordered table-striped">
                <thead class="table-white">
                <tr>
                    <th>ID</th>
                    <th>Nombre del Grupo</th>
                    <th>Capacidad</th>
                    <th>Inscritos</th>
                    <th>Materia</th>
                    <th>Horario</th>
                </tr>
                </thead>
                <tbody>
                <ui:repeat value="#{teacherController.listaGrupos}" var="group">
                    <tr>
                        <td>#{group.id}</td>
                        <td>#{group.name}</td>
                        <td>#{group.capacity}</td>
                        <td>#{group.enrolledCount}</td>
                        <td>#{group.subjectName}</td>
                        <td>
                            <ui:repeat value="#{group.schedules}" var="schedule">
                                <div>
                                    #{schedule.day} #{schedule.startTime}-#{schedule.endTime} (#{schedule.classroom})
                                </div>
                            </ui:repeat>
                        </td>
                        <td>
                            <!--DEBE DE MOSTRAR UN BOTON QUE DIRECCIONE A OTRA PAGINA DONDE MUESTRE UNA TABLA DE ESTUDIANTES MATRIUCLADOS -->
                            <h:commandLink
                                    value="Ver Estudiantes"
                                    action="#{teacherController.verEstudiantesPorGrupo}">

                                <f:setPropertyActionListener value="#{group.id}" target="#{teacherController.idGrupoSeleccionado}" />
                                <f:setPropertyActionListener value="#{group.subjectId}" target="#{teacherController.subjectIdSeleccionado}" />
                            </h:commandLink>

                        </td>
                    </tr>
                </ui:repeat>
                </tbody>
            </table>
        </h:form>

    </div>
</h:body>
</html>
