<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      lang="es">
<h:head>
    <meta charset="UTF-8" />
    <title>Materiales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"></link>

    <h:outputStylesheet library="assets" name="css/StylesLoan.css" />
</h:head>
<h:body>
    <!-- Header -->
    <ui:include src="/assets/components/header/header.xhtml" />



    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="m-0">Subir Notas</h2>

        </div>

        <!-- Contenedor de tarjetas -->

        <h:form id="StudentsTable">
            <table class="table table-bordered table-striped">
                <thead class="table-white">
                <tr>
                    <th>ID</th>
                    <th>Codigo</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Nombre Carrera</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <ui:repeat value="#{teacherController.listaGrupos}" var="group">
                    <ui:repeat value="#{group.students}" var="student">
                        <tr>
                            <td>#{student.id}</td>
                            <td>#{student.code}</td>
                            <td>#{student.name}</td>
                            <td>#{student.email}</td>
                            <td>#{student.careerName}</td>
                            <td>
                                <p:commandLink value="Subir Notas"
                                               action="#{teacherController.seleccionarEstudiante(student.id)}"
                                               oncomplete="PF('notaDialog').show()"
                                               update=":formSubirNota">
                                    <f:setPropertyActionListener value="#{group.id}" target="#{teacherController.idGrupoSeleccionado}" />
                                </p:commandLink>

                            </td>
                        </tr>
                    </ui:repeat>
                </ui:repeat>

                </tbody>
            </table>
            <div>
                <h:commandButton value="Inicializar Periodos"
                                 action="#{teacherController.inicializarPeriodosParaEstudiante}"
                                 rendered="#{not empty teacherController.estudianteSeleccionado}" />
            </div>
        </h:form>

        <!-- Modal para subir notas -->
        <p:dialog header="Subir Nota"
                  widgetVar="notaDialog"
                  modal="true"
                  resizable="false"
                  closable="true"
                  width="400">

            <h:form id="formSubirNota">
                <div class="mb-3">
                    <h:outputLabel for="periodo" value="Seleccione el Corte:" />
                    <h:selectOneMenu id="periodo" value="#{teacherController.periodoSeleccionado}" styleClass="form-select">
                        <f:selectItem itemLabel="Seleccione" itemValue="" />
                        <f:selectItem itemLabel="Primer Corte" itemValue="PRIMERO" />
                        <f:selectItem itemLabel="Segundo Corte" itemValue="SEGUNDO" />
                        <f:selectItem itemLabel="Tercer Corte" itemValue="TERCERO" />
                    </h:selectOneMenu>
                </div>

                <div class="mb-3">
                    <h:outputLabel for="nota" value="Nota:" />
                    <h:inputText id="nota" value="#{teacherController.nota}" styleClass="form-control">
                        <f:validateDoubleRange minimum="0.0" maximum="5.0" />
                    </h:inputText>
                </div>

                <p:commandButton value="Guardar"
                                 action="#{teacherController.guardarNota}"
                                 update=":StudentsTable"
                                 oncomplete="PF('notaDialog').hide()" />
            </h:form>
        </p:dialog>

    </div>
</h:body>
</html>
