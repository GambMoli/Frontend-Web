        <!-- Contenedor de tarjetas -->

        <h:form id="StudentsTable">
            <table class="table table-bordered table-striped">
                <thead class="table-white">
                <tr>
                    <th>ID</th>
                    <th>Codigo</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Nombre Carrera</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <ui:repeat value="#{teacherController.listaGrupos}" var="group">
                    <ui:repeat value="#{group.students}" var="student">
                        <tr>
                            <td>#{student.id}</td>
                            <td>#{student.code}</td>
                            <td>#{student.name}</td>
                            <td>#{student.email}</td>
                            <td>#{student.careerName}</td>
                            <td>
                                <h:commandLink
                                        value="Subir Notas"
                                        action="#{teacherController.verEstudiantesPorGrupo}">
                                    <f:setPropertyActionListener value="#{group.id}" target="#{teacherController.idGrupoSeleccionado}" />
                                </h:commandLink>
                            </td>
                        </tr>
                    </ui:repeat>
                </ui:repeat>

                </tbody>
            </table>
        </h:form>
