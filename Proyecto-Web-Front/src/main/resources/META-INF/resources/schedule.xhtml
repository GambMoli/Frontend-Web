<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <meta charset="UTF-8" />
    <title>Horario Académico</title>

    <!-- Bootstrap y Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Estilos personalizados -->
    <h:outputStylesheet name="css/StylesSchedule.css" library="assets" />
</h:head>

<h:body>

    <!-- Header global -->
    <ui:include src="/assets/components/header/header.xhtml" />

    <div class="container mt-4 schedule-container">
        <div class="card">
            <div class="card-header">
                <h3 class="m-0">
                    <i class="fas fa-calendar-alt me-2"></i>Horario Académico
                </h3>
            </div>

            <div class="card-body">
                <!-- Loading -->
                <h:panelGroup rendered="#{scheduleController.loading}">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-3 text-muted">Cargando horario...</p>
                    </div>
                </h:panelGroup>

                <!-- Error -->
                <h:panelGroup rendered="#{scheduleController.error and not scheduleController.loading}">
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        #{scheduleController.errorMessage}
                    </div>
                </h:panelGroup>

                <!-- Horario -->
                <h:panelGroup rendered="#{not scheduleController.loading and not scheduleController.error}">
                    <div class="schedule-table-container">
                        <table class="schedule-table">
                            <thead>
                            <tr>
                                <th class="time-column">Hora</th>
                                <ui:repeat value="#{scheduleController.dayNames}" var="dayName">
                                    <th>#{dayName}</th>
                                </ui:repeat>
                            </tr>
                            </thead>
                            <tbody>
                            <ui:repeat value="#{scheduleController.timeSlots}" var="timeSlot">
                                <tr>
                                    <td class="time-cell">#{timeSlot}</td>
                                    <ui:repeat value="#{scheduleController.dayNames}" var="dayName">
                                        <td class="day-cell">
                                            <ui:repeat value="#{scheduleController.getClassesForDayAndTime(dayName, timeSlot)}" var="classItem">
                                                <div class="class-block" style="cursor: default; pointer-events: none;">
                                                    <div class="class-name">#{classItem.subjectName}</div>
                                                    <div class="class-time">#{classItem.startTime} - #{classItem.endTime}</div>
                                                    <div class="class-room">#{classItem.classroom}</div>
                                                </div>
                                            </ui:repeat>
                                        </td>
                                    </ui:repeat>
                                </tr>
                            </ui:repeat>
                            </tbody>
                        </table>
                    </div>
                </h:panelGroup>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
