<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <meta charset="UTF-8" />
    <title>Record Académico</title>

    <!-- Bootstrap y Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Estilos personalizados -->
    <h:outputStylesheet name="css/StylesNotes.css" library="assets" />
</h:head>

<h:body>

    <!-- Header global -->
    <ui:include src="/assets/components/header/header.xhtml" />

    <div class="container mt-4 record-container">
        <div class="card">
            <div class="card-header">
                <h3 class="m-0">
                    <i class="fas fa-graduation-cap me-2"></i>
                    Record Académico
                </h3>
            </div>

            <div class="card-body">

                <h:panelGroup rendered="#{academicRecordController.error}">
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        #{academicRecordController.errorMessage}
                    </div>
                </h:panelGroup>

                <h:panelGroup rendered="#{not academicRecordController.loading and not academicRecordController.error}">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                            <tr>
                                <th>Asignatura</th>
                                <th>Corte 1</th>
                                <th>Corte 2</th>
                                <th>Corte 3</th>
                                <th>Definitiva</th>
                                <th>Estado</th>
                            </tr>
                            </thead>
                            <tbody>
                            <ui:repeat value="#{academicRecordController.currentSemesterGrades}" var="subject">
                                <tr>
                                    <td>#{subject.subjectName}</td>
                                    <td>#{subject.grade1}</td>
                                    <td>#{subject.grade2}</td>
                                    <td>#{subject.grade3}</td>
                                    <td><strong>#{subject.finalGrade}</strong></td>
                                    <td>
                                            <span class="badge #{subject.approved ? 'bg-success' : 'bg-danger'}">
                                                #{subject.approved ? 'Aprobada' : 'Reprobada'}
                                            </span>
                                    </td>
                                </tr>
                            </ui:repeat>
                            </tbody>
                        </table>
                    </div>
                </h:panelGroup>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
