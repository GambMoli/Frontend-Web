<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <meta charset="UTF-8" />
    <title>Reservas</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"></link>

    <!-- Estilos propios -->
    <h:outputStylesheet name="css/StylesReserve.css" library="assets" />
</h:head>

<h:body>

    <!-- Header -->
    <ui:include src="/assets/components/header/header.xhtml" />

    <!-- Botón para abrir modal -->
    <div class="containerButton">
        <div class="ContainerSecTittle"><h3>Reservas De Espacíos</h3></div>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Crear Reserva
        </button>
    </div>

    <!-- Tabla de reservas -->
    <div class="ContainerTable">
        <table class="table table-bordered table-striped">
            <thead class="table-white">
            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Fecha</th>
                <th>Hora Inicio</th>
                <th>Hora Fin</th>
                <th>Estado</th>
                <th>Lugar</th>
                <th>Acciones</th>

            </tr>
            </thead>
            <tbody>
            <ui:repeat var="reserve" value="#{studentController.listReserve}">
                <tr>
                    <td>#{reserve.id}</td>
                    <td>#{reserve.code}</td>
                    <td>#{reserve.reserveDate}</td>
                    <td>#{reserve.hourInit}</td>
                    <td>#{reserve.hourFinish}</td>
                    <td>#{reserve.state}</td>
                    <td>#{reserve.place != null ? reserve.place.name : 'Sin lugar'}</td>
                    <td>
                        <h:form styleClass="d-inline">
                            <h:commandLink action="#{reserveController.prepareUpdate(reserve.id)}"
                                           styleClass="text-decoration-none">
                                <f:ajax execute="@this"
                                        render=":formEditar"
                                        onevent="abrirModalUpdate" />
                                <i class="bi bi-pencil-square text-primary"></i>
                            </h:commandLink>
                        </h:form>
                    </td>
                    <td>
                        <!-- Botón de editar que pasa el ID de la reserva -->
                        <h:form styleClass="d-inline">
                            <h:commandLink action="#{reserveController.deleteReserveConParametro(reserve.id)}"
                                           styleClass="btn btn-link p-0 border-0 bg-transparent"
                                           onclick="return confirm('¿Estás seguro de eliminar esta reserva?')">
                                <i class="fa-solid fa-trash text-danger"></i>
                            </h:commandLink>
                        </h:form>

                    </td>
                </tr>
            </ui:repeat>
            </tbody>
        </table>
    </div>

    <!-- Modal editar reserva -->
    <div class="modal fade" id="modalUpdate" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <h5 class="modal-title m-3">Editar Reserva</h5>
                <div class="modal-body">
                    <h:form id="formEditar" prependId="formEditar">
                        <!-- Campo oculto para el ID de la reserva -->
                        <h:inputHidden id="idReservaHidden" value="#{reserveController.idReservaSeleccionada}" />

                        <div class="mb-3">
                            <label for="fechaEdit">Fecha</label>
                            <h:inputText id="fechaEdit" value="#{reserveController.reserveDate}" styleClass="form-control">
                                <f:passThroughAttribute name="type" value="date" />
                            </h:inputText>
                        </div>

                        <div class="mb-3">
                            <label for="horaInicioEdit">Hora Inicio</label>
                            <h:inputText id="horaInicioEdit" value="#{reserveController.hourInit}" styleClass="form-control">
                                <f:passThroughAttribute name="type" value="time" />
                            </h:inputText>
                        </div>

                        <div class="mb-3">
                            <label for="horaFinEdit">Hora Fin</label>
                            <h:inputText id="horaFinEdit" value="#{reserveController.hourFinish}" styleClass="form-control">
                                <f:passThroughAttribute name="type" value="time" />
                            </h:inputText>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>

                            <h:commandButton value="Guardar"
                                             action="#{reserveController.updateReserve}"/>
                        </div>
                    </h:form>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal crear reserva -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <h:form prependId="false">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Crear Reserva</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="fecha">Fecha</label>
                            <h:inputText id="fecha" value="#{reserveController.reserveDate}" styleClass="form-control">
                                <f:passThroughAttribute name="type" value="date" />
                            </h:inputText>
                        </div>

                        <div class="mb-3">
                            <label for="horaInicio">Hora Inicio</label>
                            <h:inputText id="horaInicio" value="#{reserveController.hourInit}" styleClass="form-control">
                                <f:passThroughAttribute name="type" value="time" />
                            </h:inputText>
                        </div>

                        <div class="mb-3">
                            <label for="horaFin">Hora Fin</label>
                            <h:inputText id="horaFin" value="#{reserveController.hourFinish}" styleClass="form-control">
                                <f:passThroughAttribute name="type" value="time" />
                            </h:inputText>
                        </div>

                        <div class="mb-3">
                            <label for="lugarId">Lugar</label>
                            <h:selectOneMenu id="lugarId" value="#{reserveController.placeId}" styleClass="form-select">
                                <f:selectItems value="#{reserveController.listaLugares}" var="lugar"
                                               itemLabel="#{lugar.name}" itemValue="#{lugar.id}" />
                            </h:selectOneMenu>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <h:commandButton value="Guardar" action="#{reserveController.guardarReserva}" styleClass="btn btn-primary" />
                    </div>
                </h:form>
            </div>
        </div>
    </div>

    <!-- Scripts strap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script>
        function abrirModalUpdate(data) {
          if (data.status === 'success') {
            const modal = new bootstrap.Modal(document.getElementById('modalUpdate'));
            modal.show();
          }
        }
    </script>

</h:body>
</html>
