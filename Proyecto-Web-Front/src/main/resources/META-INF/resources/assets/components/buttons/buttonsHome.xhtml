<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!-- Bootstrap CSS -->
    <h:outputStylesheet library="webjars" name="bootstrap/5.3.3/css/bootstrap.min.css" />

    <!-- Font Awesome -->
    <h:outputStylesheet library="webjars" name="font-awesome/6.4.0/css/all.min.css" />

    <!-- Estilos personalizados -->
    <h:outputStylesheet name="assets/components/buttons/stylesHomeButtons.css" />

    <!-- Bootstrap Bundle JS -->
    <h:outputScript library="webjars" name="bootstrap/5.3.3/js/bootstrap.bundle.min.js" />

    <!-- Contenedor principal con tu estilo de fondo -->
    <div class="ContainerHome">
        <div class="ContenedorBotones container">
            <div class="row g-4 r">

                <div class="col-md-4 col-sm-6">
                    <h:form>
                        <h:commandLink action="#{loginController.redirigirLibreria}"
                                       styleClass="btn btn-outline-primary custom-btn w-100 d-flex align-items-center justify-content-center">
                            <i class="fa-brands fa-rocketchat me-2"></i>
                            Reserva Libros
                        </h:commandLink>
                    </h:form>
                </div>

                <div class="col-md-4 col-sm-6">
                    <h:form>
                        <h:commandLink action="#{loginController.redirigirReserva}"
                                       styleClass="btn btn-outline-primary custom-btn w-100 d-flex align-items-center justify-content-center">
                            <i class="fa-brands fa-rocketchat me-2"></i>
                            Reserva Espacios
                        </h:commandLink>
                    </h:form>
                </div>

                <div class="col-md-4 col-sm-6">
                    <h:link outcome="/academic_plan" styleClass="btn btn-outline-primary custom-btn w-100 d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-pen-to-square me-2"></i>
                        Plan Académico
                    </h:link>
                </div>

                <div class="col-md-4 col-sm-6">
                    <h:link outcome="/home" styleClass="btn btn-outline-primary custom-btn w-100 d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-calendar-days me-2"></i>
                        Horario
                    </h:link>
                </div>

                <div class="col-md-4 col-sm-6">
                    <h:link outcome="/home" styleClass="btn btn-outline-primary custom-btn w-100 d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-user me-2"></i>
                        Usuarios
                    </h:link>
                </div>

                <div class="col-md-4 col-sm-6">
                    <h:link outcome="/enroll" styleClass="btn btn-outline-primary custom-btn w-100 d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-pen-to-square me-2"></i>
                        Matrícula
                    </h:link>
                </div>

                <div class="col-md-4 col-sm-6">
                    <h:link outcome="/notes_record" styleClass="btn btn-outline-primary custom-btn w-100 d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-pen-to-square me-2"></i>
                        Record de Notas
                    </h:link>
                </div>
            </div>
        </div>
    </div>
</ui:composition>
